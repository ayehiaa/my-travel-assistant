<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trip Timeline — Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 32px 24px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: #f8fafc;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 36px;
  }

  .chart-wrapper {
    background: #1e2130;
    border-radius: 16px;
    padding: 28px 24px 24px;
    border: 1px solid #2d3348;
    overflow-x: auto;
  }

  .chart {
    min-width: 700px;
    position: relative;
  }

  .month-header {
    display: flex;
    margin-left: 130px;
    margin-bottom: 8px;
    position: relative;
  }

  .month-label {
    font-size: 0.7rem;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    flex-shrink: 0;
    text-align: center;
  }

  .grid-area {
    position: relative;
    margin-left: 130px;
  }

  .grid-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

  .grid-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: #2d3348;
  }

  .trip-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    position: relative;
    height: 44px;
  }

  .trip-label {
    width: 130px;
    flex-shrink: 0;
    padding-right: 16px;
    text-align: right;
    margin-left: -130px;
  }

  .airport-code {
    font-size: 0.78rem;
    font-weight: 600;
    color: #94a3b8;
    letter-spacing: 0.04em;
  }

  .trip-bar-container {
    position: relative;
    flex: 1;
    height: 44px;
    width: 100%;
  }

  .trip-bar {
    position: absolute;
    height: 36px;
    top: 4px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.15s;
    white-space: nowrap;
    overflow: hidden;
    min-width: 40px;
  }

  .trip-bar:hover {
    filter: brightness(1.2);
    transform: scaleY(1.06);
    z-index: 10;
  }

  .trip-flag { font-size: 1.1rem; flex-shrink: 0; }
  .trip-name { font-size: 0.78rem; font-weight: 600; color: #fff; opacity: 0.95; }
  .trip-dates { font-size: 0.68rem; color: rgba(255,255,255,0.6); }

  .today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #f59e0b;
    z-index: 5;
    pointer-events: none;
  }

  .today-label {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    font-weight: 700;
    color: #f59e0b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: #1e2130;
    padding: 0 4px;
    white-space: nowrap;
  }

  .tooltip {
    position: fixed;
    background: #0f1117;
    border: 1px solid #3d4460;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.78rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    min-width: 180px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .tooltip.visible { opacity: 1; }
  .tooltip-flag { font-size: 1.4rem; margin-bottom: 6px; }
  .tooltip-dest { font-size: 0.9rem; font-weight: 600; color: #f8fafc; margin-bottom: 4px; }
  .tooltip-row { color: #64748b; margin-bottom: 2px; }
  .tooltip-row span { color: #cbd5e1; }

  .stats-row {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: #1e2130;
    border: 1px solid #2d3348;
    border-radius: 10px;
    padding: 14px 20px;
    flex: 1;
    min-width: 120px;
  }

  .stat-value { font-size: 1.4rem; font-weight: 700; color: #f8fafc; }
  .stat-label { font-size: 0.72rem; color: #64748b; margin-top: 2px; }

  .legend {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #2d3348;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: #64748b;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>Trip Timeline</h1>
<p class="subtitle">Apr 2026 — Nov 2026 &nbsp;·&nbsp; 7-month overview</p>

<div class="stats-row">
  <div class="stat-card"><div class="stat-value">5</div><div class="stat-label">Upcoming trips</div></div>
  <div class="stat-card"><div class="stat-value">1</div><div class="stat-label">Past (this window)</div></div>
  <div class="stat-card"><div class="stat-value">62</div><div class="stat-label">Days abroad</div></div>
  <div class="stat-card"><div class="stat-value">6</div><div class="stat-label">Countries</div></div>
</div>

<div class="chart-wrapper">
  <div class="chart" id="chart">
    <div style="display:flex; align-items:flex-end; margin-bottom:8px;">
      <div style="width:130px;flex-shrink:0;"></div>
      <div class="month-header" id="monthHeader" style="flex:1;margin-left:0;"></div>
    </div>
    <div style="display:flex;">
      <div style="width:130px;flex-shrink:0;"></div>
      <div class="grid-area" id="gridArea" style="flex:1;margin-left:0;">
        <div class="grid-lines" id="gridLines"></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div> Today</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6366f155;border:1px solid #6366f144;"></div> Past trip</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0ea5e9;"></div> Upcoming trip</div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const WINDOW_START = new Date('2026-04-07');
const WINDOW_END   = new Date('2026-11-07');
const TODAY        = new Date('2026-05-07');
const TOTAL_DAYS   = (WINDOW_END - WINDOW_START) / 86400000;

const TRIPS = [
  { dest: 'Dubai',     code: 'LHR → DXB', flag: '🇦🇪', start: '2026-04-10', end: '2026-04-22', color: '#6366f1', past: true  },
  { dest: 'Paris',     code: 'LHR → CDG', flag: '🇫🇷', start: '2026-05-15', end: '2026-05-20', color: '#0ea5e9', past: false },
  { dest: 'New York',  code: 'LHR → JFK', flag: '🇺🇸', start: '2026-06-01', end: '2026-06-12', color: '#10b981', past: false },
  { dest: 'Barcelona', code: 'LHR → BCN', flag: '🇪🇸', start: '2026-07-04', end: '2026-07-11', color: '#f59e0b', past: false },
  { dest: 'Tokyo',     code: 'LHR → NRT', flag: '🇯🇵', start: '2026-08-10', end: '2026-08-25', color: '#ec4899', past: false },
  { dest: 'Sydney',    code: 'LHR → SYD', flag: '🇦🇺', start: '2026-10-01', end: '2026-10-18', color: '#8b5cf6', past: false },
];

function dayOffset(dateStr) {
  return (new Date(dateStr) - WINDOW_START) / 86400000;
}
function pct(days) { return (days / TOTAL_DAYS) * 100; }
function fmtDate(d) { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function duration(s, e) { const d = Math.round((new Date(e)-new Date(s))/86400000); return `${d} day${d!==1?'s':''}`; }

// Month labels + grid lines
const monthHeader = document.getElementById('monthHeader');
const gridLines   = document.getElementById('gridLines');

let cur = new Date('2026-04-01');
while (cur <= WINDOW_END) {
  const startDay  = Math.max(0, (cur - WINDOW_START) / 86400000);
  const next = new Date(cur); next.setMonth(next.getMonth() + 1);
  const endDay = Math.min(TOTAL_DAYS, (next - WINDOW_START) / 86400000);

  const lbl = document.createElement('div');
  lbl.className = 'month-label';
  lbl.style.cssText = `width:${pct(endDay-startDay)}%;margin-left:${startDay<=0?0:0}%`;
  lbl.textContent = cur.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
  monthHeader.appendChild(lbl);

  const line = document.createElement('div');
  line.className = 'grid-line';
  line.style.left = pct(startDay) + '%';
  gridLines.appendChild(line);

  cur = next;
}

// Trip rows
const gridArea = document.getElementById('gridArea');
const tooltip  = document.getElementById('tooltip');

TRIPS.forEach(trip => {
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;margin-bottom:10px;height:44px;position:relative;';

  // label (outside grid area — rendered before this div)
  const outerRow = document.createElement('div');
  outerRow.style.cssText = 'display:flex;align-items:center;margin-bottom:10px;height:44px;';

  const label = document.createElement('div');
  label.style.cssText = 'width:130px;flex-shrink:0;padding-right:16px;text-align:right;';
  label.innerHTML = `<span style="font-size:0.78rem;font-weight:600;color:#94a3b8;letter-spacing:0.04em;">${trip.code}</span>`;

  const barWrap = document.createElement('div');
  barWrap.style.cssText = 'flex:1;position:relative;height:44px;';

  const bar = document.createElement('div');
  const s = Math.max(0, dayOffset(trip.start));
  const e = Math.min(TOTAL_DAYS, dayOffset(trip.end));
  bar.className = 'trip-bar';
  bar.style.left    = pct(s) + '%';
  bar.style.width   = pct(e - s) + '%';
  bar.style.background = trip.past
    ? `linear-gradient(90deg, ${trip.color}44, ${trip.color}22)`
    : `linear-gradient(90deg, ${trip.color}dd, ${trip.color}99)`;
  bar.style.border = `1px solid ${trip.color}${trip.past ? '33' : '66'}`;
  if (trip.past) bar.style.opacity = '0.75';

  bar.innerHTML = `<span style="font-size:1.3rem;">${trip.flag}</span>`;

  bar.addEventListener('mouseenter', () => {
    tooltip.innerHTML = `
      <div class="tooltip-flag">${trip.flag}</div>
      <div class="tooltip-dest">${trip.dest}</div>
      <div class="tooltip-row">Route: <span>${trip.code}</span></div>
      <div class="tooltip-row">Depart: <span>${fmtDate(trip.start)}</span></div>
      <div class="tooltip-row">Return: <span>${fmtDate(trip.end)}</span></div>
      <div class="tooltip-row">Duration: <span>${duration(trip.start,trip.end)}</span></div>
      ${trip.past ? '<div style="color:#f59e0b;margin-top:6px;font-size:0.72rem;">Past trip</div>' : ''}
    `;
    tooltip.classList.add('visible');
  });
  bar.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  });
  bar.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

  barWrap.appendChild(bar);
  outerRow.appendChild(label);
  outerRow.appendChild(barWrap);
  gridArea.appendChild(outerRow);
});

// Today line
const todayLine = document.createElement('div');
todayLine.className = 'today-line';
todayLine.style.left = pct(dayOffset(TODAY.toISOString().slice(0,10))) + '%';
todayLine.innerHTML = '<span class="today-label">Today</span>';
gridArea.appendChild(todayLine);
</script>
</body>
</html>
